</style>
  <style>:root {
  color-scheme: light dark;
  --font-serif: "anthropic-serif", Georgia, "Times New Roman", serif;

/* CDS removed these, but a widget Claude has already written can read them, and a reopened conversation wraps its old HTML in this sheet. */
:root,
[data-mode="light"],
[data-mode="dark"],
[data-mode="system"] {
  --fill-git-modified-hover: var(--fill-git-modified);
  --fill-git-merged-hover: var(--fill-git-merged);
  --fill-git-closed-hover: var(--fill-git-closed);
  --fill-git-draft-hover: var(--fill-git-draft);
  --fill-git-opened-hover: var(--fill-git-added-hover);
  /* Darker than the text colour, so white on it stays as readable as on the fill CDS had. */
  --fill-git-conflicting: color-mix(
    in srgb,
    var(--text-git-conflicting) 93%,
    black
  );
  --fill-git-conflicting-hover: var(--fill-git-conflicting);
  --on-git-conflicting: var(--on-git-modified);
  --fill-git-queued: var(--fill-git-modified);
  --fill-git-queued-hover: var(--fill-git-modified);
  --on-git-queued: var(--on-git-modified);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
input,
select,
textarea,
button {
  font-family: inherit;
}
body {
  font-family: var(--font-sans);
  background: transparent;
}
/* The host sizes the iframe a frame late, and a scrollbar shown meanwhile would take ~15px and reflow the visual, so it has no width.
 * A saved page (data-saved) is in no iframe and keeps its scrollbars. :where() adds no weight, so a visual's own rule still wins. */
html:where(:not([data-saved])),
:where(html:not([data-saved])) body {
  scrollbar-width: none;
}
html:where(:not([data-saved]))::-webkit-scrollbar,
:where(html:not([data-saved])) body::-webkit-scrollbar {
  width: 0;
  height: 0;
}
/* Short var aliases — saves ~5 tokens per reference */
:root {
  --p: var(--text-primary);
  --s: var(--text-secondary);
  --t: var(--text-muted);
  --bg2: var(--surface-1);
  --b: var(--border-strong);
}

/* For browsers without light-dark() (before Chrome 123, Safari 17.5, Firefox 120). In the current theme one of these is
   initial, so var() gives its fallback; the other is empty and adds nothing. Modes are picked as in tokens.vanilla.css. */
:root,
[data-mode="light"],
[data-mode="system"] {
  /* The empty one goes first in each rule. jsdom, which the tests run in, reads an empty value on past its ";":
     put last, it takes in the "}" as well and rules are lost. */
  --shell-when-dark: ;
  --shell-when-light: initial;
}
@media screen {
  [data-mode="dark"] {
    --shell-when-light: ;
    --shell-when-dark: initial;
  }
}
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]),
  [data-mode="system"] {
    --shell-when-light: ;
    --shell-when-dark: initial;
  }
}

/* SVG utility classes — use class="t" instead of repeating font/fill attrs */
.t {
  font-size: 14px;
  fill: var(--p);
}
.ts {
  font-size: 12px;
  fill: var(--s);
}
.th {
  font-size: 14px;
  fill: var(--p);
  font-weight: 500;
}
.box {
  fill: var(--bg2);
  stroke: var(--b);
}
.arr {
  stroke: var(--t);
  fill: none;
  stroke-width: 1.5;
}
/* Browsers without context-stroke (WebKit, Chrome before 124) ignore that attribute, so an arrowhead drawn only by it
   is invisible. In them it gets the grey of an .arr line; :where() lets a visual's own rule for it still win. */
@supports not (stroke: context-stroke) {
  :where(marker) :where([stroke="context-stroke"]) {
    stroke: var(--t);
  }
}
.node {
  cursor: pointer;
}
.node:hover rect,
.node:hover .box {
  filter: brightness(0.97);
}
.node:hover text {
  opacity: 0.8;
}

/* Form element defaults — model writes bare <input>, styling is automatic */
/* :not(form.elicit *) — elicitation form provides its own
 * input/button styling at (0,1,0). Without this exclusion, these
 * generic rules at (0,3,1) / (1,0,2) clobber every .elicit-* class. */
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ),
select:not(form.elicit *),
textarea:not(form.elicit *) {
  /* iOS zooms the page when a focused input's font size is under 16px. */
  --input-font-size: max(16px, var(--font-text-md-size, 16px));
  width: 100%;
  /* 36px tall at the default 16px font; a fixed height clips select text in larger fonts. */
  height: calc(var(--input-font-size) * 2.25);
  padding: 8px 12px;
  font-size: var(--input-font-size);
  background: var(--surface-2);
  color: var(--text-primary);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
textarea {
  height: auto;
  min-height: 80px;
  resize: vertical;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ):hover,
select:not(form.elicit *):hover,
textarea:not(form.elicit *):hover {
  border-color: var(--border-strong);
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not(
    form.elicit *
  ):focus,
select:not(form.elicit *):focus,
textarea:not(form.elicit *):focus {
  border-color: var(--border-accent);
  box-shadow: 0 0 0 3px var(--bg-accent);
}
select {
  cursor: pointer;
}

/* Range slider — model writes bare <input type="range">, styling automatic */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--shell-when-light, rgba(0, 0, 0, 0.08))
    var(--shell-when-dark, rgba(255, 255, 255, 0.1));
  background: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.1));
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  transition:
    border-color 0.15s,
    transform 0.15s;
}
input[type="range"]:hover::-webkit-slider-thumb {
  border-color: var(--border-stronger);
  transform: scale(1.1);
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  cursor: pointer;
}

/* Button defaults — model writes bare <button>, interaction states automatic */
button:not(
    #action-btns button,
    :where(#vis-container ~ #larger-btns) button
  ):not(form.elicit button) {
  padding: 8px 16px;
  font-size: var(--font-text-sm-size, 14px);
  background: transparent;
  color: var(--text-primary);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.1s;
}
button:not(
    #action-btns button,
    :where(#vis-container ~ #larger-btns) button
  ):not(form.elicit button):hover {
  background: var(--surface-1);
}
button:not(
    #action-btns button,
    :where(#vis-container ~ #larger-btns) button
  ):not(form.elicit button):active {
  background: var(--border);
  transform: scale(0.98);
}

/* Elicitation form. Inert unless Claude writes <form class="elicit">. Looks like claude.ai's own question cards:
 * the @ant/cds design system's AskUserQuestion, and AskUserInputSheet.tsx, which asks every question on one card. */

form.elicit {
  /* @ant/cds's COMPOSER_CARD_SHELL_CLASS, its 1px ring drawn as a border. On surface-2, not its surface-3: in dark, surface-3 is lighter than the surface-2 file tiles and slider thumb.
   * The bottom margin keeps the shadow (4px down, 20px blur) from clipping at #vis-container's overflow:hidden edge. None at the left, the edge of claude.ai's other blocks (hubResponseProse.ts); 1px at the right, which a host's clip can cut at a fractional display scale. */
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-composer);
  box-shadow: 0 4px 20px color-mix(in srgb, var(--black) 3.5%, transparent);
  margin: 4px 1px 24px 0;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: var(--font-text-sm-size, 14px);
  line-height: calc(20 / 14);
  /* Match host rendering — without this the iframe uses subpixel AA and
   * everything (notably weight-500 buttons) reads ~100 heavier on Retina
   * than the same tokens outside the iframe. */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Chrome props animate on the form→submitted-summary swap. */
  transition:
    background-color 200ms ease-out,
    box-shadow 200ms ease-out,
    border-radius 200ms ease-out,
    padding 200ms ease-out,
    margin 200ms ease-out;
  /* Shared FileThumbnail tokens (border-border-300/25, shadow-sm/5). */
  --elicit-border-faint: color-mix(in srgb, var(--border) 25%, transparent);
  --elicit-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
/* Form controls don't inherit font props from the UA sheet — pull from root.
 * `font: inherit` shorthand so font-weight comes too; the individual-prop
 * version left weight at the UA <button> default (bold-ish on some
 * platforms) for any control that doesn't set its own weight. */
form.elicit :is(button, input, textarea) {
  font: inherit;
}

form.elicit .elicit-header,
form.elicit .elicit-question {
  color: var(--text-primary);
}

/* A set height (40px at the default 14px text size, room for one line) lets align-items:center place the icon and text,
 * and lets the submitted state's height:0 transition run. */
form.elicit .elicit-header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: calc(var(--font-text-sm-size, 14px) * 40 / 14);
  padding: 6px 16px 0;
}
form.elicit .elicit-header > svg {
  /* IconBase vectorSizeMap[16] = 20 — anthropicons render in a 20px box. */
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  fill: currentColor;
}
form.elicit .elicit-header > span {
  flex: 1;
}

form.elicit .elicit-body {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
}

/* Negative margins stretch each group to the card's edges, so the hairline between questions runs edge to edge, as in AskUserInputSheet. */
form.elicit .elicit-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 -16px;
  padding: 10px 16px 14px;
}
form.elicit .elicit-group + .elicit-group {
  border-top: 0.5px solid var(--border);
}
/* Whatever Claude writes straight into the body, outside a group. */
form.elicit .elicit-body > :not(.elicit-group, .elicit-summary) {
  margin-bottom: 8px;
}
form.elicit .elicit-body > :not(.elicit-group, .elicit-summary):first-child {
  margin-top: 10px;
}

form.elicit .elicit-question {
  margin: 0;
}

/* Pills container — no horizontal padding. Previously had 0 8px which pushed
 * pills 8px right of the question/textarea/date in the same .elicit-group. */
form.elicit .elicit-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
form.elicit .elicit-pill {
  /* @ant/cds Button's default shape (8px corners, 32px tall at the default text size) with RadioGroup.Card's borders. */
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-primary);
  cursor: pointer;
  transition:
    border-color 120ms ease,
    background-color 120ms ease;
}
form.elicit .elicit-pill:hover {
  border-color: var(--border-strong);
}
/* Semantic accents: fill, border and text of one hue, set by data-accent rather than inline style, which would outrank the picked rule below.
 * The [aria-pressed="true"] rule below has the same specificity and comes later, so a picked accented pill still shows as picked. */
form.elicit .elicit-pill[data-accent="warning"] {
  border-color: var(--text-warning);
  background: color-mix(in srgb, var(--text-warning) 15%, transparent);
  color: var(--text-warning);
}
form.elicit .elicit-pill[data-accent="danger"] {
  border-color: var(--text-danger);
  background: color-mix(in srgb, var(--text-danger) 15%, transparent);
  color: var(--text-danger);
}
form.elicit .elicit-pill[data-accent="success"] {
  border-color: var(--text-success);
  background: color-mix(in srgb, var(--text-success) 15%, transparent);
  color: var(--text-success);
}
form.elicit .elicit-pill[aria-pressed="true"] {
  /* RadioGroup.Card marks its pick with a radio dot, which a pill lacks, so the pill's border takes the dot's color,
   * which has at least 3:1 contrast with the card in both themes (WCAG's minimum for controls). */
  border-color: var(--fill-accent);
  background: var(--bg-accent-muted);
  color: var(--text-primary);
}
/* An option the form's own script takes away (elicit-design-system.ts). !important because a tile's own display, inline or from its class, would win. */
form.elicit .elicit-pill[hidden] {
  display: none !important;
}
/* Hides the design-system option while data-no-design-system is on the root, including in a form still streaming in. sync: SOURCES and OPTION in elicit-design-system.ts, and the hairline rule under :root[data-steps]. */
:root[data-no-design-system]
  form.elicit:is(
    [data-source="drifting-trinket-slides"],
    [data-source="drifting-trinket-design"]
  )
  .elicit-pill:is([data-design-system], [data-value="Use my design system"]) {
  display: none !important;
}
/* The design system's four colors in a row of plain options: a small swatch before the name. In a card, the card's own rule draws the i. */
form.elicit .elicit-pill:not(.elicit-card) > .elicit-ds-bar {
  display: inline-block;
  width: 40px;
  height: 12px;
  margin-inline-end: 8px;
  border-radius: 3px;
  outline: 1px solid #8884;
  outline-offset: -1px;
  vertical-align: -1px;
  background: linear-gradient(
    90deg,
    var(--g) 25%,
    var(--m) 0 50%,
    var(--c) 0 75%,
    var(--a) 0
  );
}
/* With a coarse pointer or no hover (@ant/cds's TOUCH_QUERY) an option is at least 44px tall, as claude.ai's question-card rows are at default density. */
@media (pointer: coarse), (hover: none) {
  form.elicit .elicit-pill {
    min-height: 44px;
  }
}

/* Options drawn as small pages in their own colors. The prompts that open a new slide deck or design (outside this package) teach Claude the markup:
 * .elicit-cards on an .elicit-pills row, .elicit-card on a pill, and first in it an empty <i> whose style sets --g, --m, --c, --a (background, main, text, accent). */
form.elicit .elicit-cards {
  display: grid;
  grid-template-columns: repeat(
    auto-fill,
    minmax(clamp(110px, 50% - 4px, 124px), 1fr)
  );
}
form.elicit .elicit-cards > .elicit-pill:not(.elicit-card) {
  place-self: center start;
}
form.elicit .elicit-card {
  /* A grid: a plain button stretched to its row's height would center its content vertically. */
  display: grid;
  align-content: start;
  padding: 0 9px 8px;
  border-radius: 12px;
  overflow: hidden;
  overflow-wrap: anywhere;
  text-align: start;
}
/* The same prompts send a fallback rule that draws the <i> as a bar of colors on pages built without this CSS.
 * It arrives here too, so this rule must set every property it sets, to override it. */
form.elicit .elicit-card > i {
  --elicit-ink: var(--c, var(--text-muted));
  --elicit-dot: var(--a, var(--text-muted));
  display: block;
  /* On top even where the name is written first. */
  order: -1;
  position: relative;
  height: 54px;
  margin: 0 -9px 6px;
  border-bottom: 0.5px solid var(--border);
  border-radius: 0;
  box-shadow: none;
  /* The drawn button's two round ends and its middle, then a line of small text. */
  background:
    radial-gradient(
      circle at 16px 38px,
      var(--elicit-dot) 3.6px,
      transparent 4.1px
    ),
    radial-gradient(
      circle at 29px 38px,
      var(--elicit-dot) 3.6px,
      transparent 4.1px
    ),
    linear-gradient(var(--elicit-dot) 0 0) 16px 34px / 13px 8px no-repeat,
    linear-gradient(color-mix(in srgb, var(--elicit-ink) 45%, transparent) 0 0)
      12px 24px / 32px 3px no-repeat;
  /* Kept out of `background` above: one invalid color there drops that whole declaration. */
  background-color: var(--g, var(--surface-1));
  print-color-adjust: exact;
  forced-color-adjust: none;
}
form.elicit .elicit-card > i::before,
form.elicit .elicit-card > i::after {
  content: "";
  position: absolute;
}
form.elicit .elicit-card > i::before {
  top: 13px;
  left: 12px;
  width: 44px;
  height: 6px;
  border-radius: 3px;
  background: var(--elicit-ink);
}
form.elicit .elicit-card > i::after {
  top: 10px;
  right: 12px;
  width: 39px;
  height: 34px;
  border-radius: 5px;
  background: radial-gradient(
    circle,
    var(--elicit-dot) 7.6px,
    transparent 8.1px
  );
  background-color: var(
    --m,
    color-mix(in srgb, var(--text-muted) 30%, transparent)
  );
}
/* In forced colors the picked border and fill barely show, so a picked card takes the system's own colors for a selection. */
@media (forced-colors: active) {
  form.elicit .elicit-card[aria-pressed="true"] {
    forced-color-adjust: none;
    border-color: Highlight;
    background: Highlight;
    color: HighlightText;
  }
}

/* One question at a time (elicit-steps.ts sets the root's mark and each data-step). Looks like @ant/cds's AskUserQuestion card. */
:root[data-steps] form.elicit {
  position: relative;
}
:root[data-steps] form.elicit:not(.elicit-submitted) .elicit-header {
  display: none;
}
/* Every question sits in one grid cell, so the form is as tall as its tallest question and going from step to step moves nothing under it. An opened "Other" box can still add height. */
:root[data-steps] form.elicit:not(.elicit-submitted) .elicit-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  /* The questions' row takes the height that --elicit-held holds open: shared out, it would move a line written under the questions. */
  grid-template-rows: 1fr;
  min-height: var(--elicit-held, 0);
  padding: 0;
}
:root[data-steps] .elicit-body > .elicit-group {
  grid-area: 1 / 1;
  align-content: start;
  gap: 6px;
  margin: 0;
  padding: 12px 6px 6px;
  border: 0;
}
/* Just after a step (elicit-steps.ts): only the two arrows, which change no answer, can be pressed. A disabled arrow lets a press through at all times, for the script to count like any other. */
:root[data-steps][data-resting] form.elicit,
:root[data-steps] .elicit-pager > button:disabled {
  pointer-events: none;
}
:root[data-steps] .elicit-pager > button:enabled:not(:last-child) {
  pointer-events: auto;
}
/* On an iPhone a second tap falls through the resting form and selects the nearest word anywhere in the page, so every box in the body is covered: most of the frame is restyled twice a step. */
/* #larger-btns and #not-sent are named because their "all: revert" outranks "body > div". A box must stay typeable. */
:root[data-steps][data-resting] body > div,
:root[data-steps][data-resting] #vis-container ~ #larger-btns,
:root[data-steps][data-resting] #vis-container ~ #not-sent {
  -webkit-user-select: none;
  user-select: none;
}
:root[data-steps][data-resting] :is(input, textarea) {
  -webkit-user-select: text;
  user-select: text;
}
/* Until the script runs (while the form streams in) the first question shows, and no Continue: the script decides whether it has one. */
:root[data-steps] form.elicit:not([data-step]) .elicit-group ~ .elicit-group,
:root[data-steps] form.elicit:not([data-step]) .elicit-submit,
:root[data-steps] form.elicit[data-step] .elicit-group:not([data-step]),
:root[data-steps] .elicit-submit[data-idle] {
  visibility: hidden;
}
/* A form's own "* { transition: all 0.3s }" would delay visibility too, so the new question would still be hidden when the script focuses it. A wrapper's transition hides what it holds the same way. */
/* The three left out keep this file's own transitions: moving to a question never focuses them. */
:root[data-steps] .elicit-group,
:root[data-steps] .elicit-group :not(.elicit-pill, .elicit-dropzone, .remove) {
  transition-property: none !important;
}
@media (prefers-reduced-motion: no-preference) {
  :root[data-steps] .elicit-group[data-step="on"] {
    animation: elicit-step 0.2s ease-out;
  }
  :root[data-steps] .elicit-group[data-step="back"] {
    --elicit-from: -12px;
    animation: elicit-step 0.2s ease-out;
  }
  :root[data-steps] .elicit-group[data-step="on"]:dir(rtl) {
    --elicit-from: -12px;
  }
  :root[data-steps] .elicit-group[data-step="back"]:dir(rtl) {
    --elicit-from: 12px;
  }
}
@keyframes elicit-step {
  from {
    opacity: 0;
    transform: translateX(var(--elicit-from, 12px));
  }
}
:root[data-steps] .elicit-question {
  min-height: 24px;
  padding-inline: 10px;
  line-height: 24px;
}
:root[data-steps] .elicit-pager ~ .elicit-body .elicit-question {
  padding-inline-end: 140px;
}
:root[data-steps] .elicit-pager {
  position: absolute;
  z-index: 1;
  top: 12px;
  inset-inline-end: 12px;
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  /* The pager's top offset, so that scrolling to the pager shows the form's top edge too. */
  scroll-margin-block: 12px;
}
form.elicit.elicit-submitted .elicit-pager {
  display: none;
}
:root[data-steps] .elicit-pager > button {
  position: relative;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  color: inherit;
  cursor: pointer;
}
/* Two chevrons, drawn and not taken from the icon font, which can come late or not at all, and a multiplication sign for the cross.
   The chevrons here and the tick further down are turned with transform: Chrome before 104 does not know the standalone translate and rotate properties. */
:root[data-steps] .elicit-pager > button::before {
  content: "";
  width: 6px;
  height: 6px;
  border: solid currentColor;
  border-width: 0 0 1.5px 1.5px;
  transform: translate(1.5px) rotate(45deg);
}
:root[data-steps] .elicit-pager > span + button::before {
  transform: translate(-1.5px) rotate(-135deg);
}
/* Apart from the rule above: a browser that does not know :dir() drops the whole of a rule that names it. */
:root[data-steps] .elicit-pager:dir(rtl) > button:first-child::before {
  transform: translate(-1.5px) rotate(-135deg);
}
:root[data-steps] .elicit-pager:dir(rtl) > span + button::before {
  transform: translate(1.5px) rotate(45deg);
}
:root[data-steps] .elicit-pager > button:last-child {
  margin-inline-start: 6px;
}
:root[data-steps] .elicit-pager > button:last-child::before {
  content: "\d7";
  content: "\d7" / "";
  width: auto;
  height: auto;
  border: 0;
  font-size: 20px;
  line-height: 1;
  transform: none;
}
/* The cross's name. Not a title: that never shows on the keyboard's focus, and a screen reader can read it out after the name. */
:root[data-steps] .elicit-tip {
  display: none;
  position: absolute;
  z-index: 2;
  top: calc(100% + 4px);
  inset-inline-end: 0;
  width: max-content;
  max-width: 240px;
  padding: 4px 8px;
  /* Transparent, not none: forced-colors mode paints it. */
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--fill-primary);
  color: var(--on-primary);
  font-size: var(--font-text-xs-size, 12px);
  line-height: 16px;
  cursor: default;
}
/* Fills the gap under the cross, so that the pointer can move onto the words without losing them. */
:root[data-steps] .elicit-tip::before {
  content: "";
  position: absolute;
  inset: -5px 0 100%;
}
:root[data-steps]
  .elicit-pager
  > button:focus-visible:not([data-hushed])
  > .elicit-tip {
  display: block;
}
:root[data-steps] .elicit-pager > button:focus-visible {
  outline: 2px solid var(--fill-accent);
  outline-offset: -1px;
}
/* On the first or last question, or while the form waits for the host's answer. */
:root[data-steps] .elicit-pager > button:disabled,
:root[data-steps] .elicit-pager > button[aria-disabled="true"] {
  opacity: 0.4;
  cursor: default;
}
:root[data-steps] .elicit-pills {
  /* !important over a form's own style line, which may lay its options out with one. */
  display: flex !important;
  flex-direction: column !important;
  gap: 0 !important;
  border-radius: 12px;
  counter-reset: elicit-row;
  /* The hairline over a row, drawn as a background so that the row's own highlight replaces it. */
  --elicit-rule: linear-gradient(var(--alpha-2) 0 0) top / calc(100% - 24px)
    0.5px no-repeat;
}
:root[data-steps] .elicit-pills:focus-visible,
:root[data-steps] .elicit-group:focus-visible,
:root[data-steps] .elicit-pill:focus-visible {
  outline: 1px solid var(--fill-accent);
  outline-offset: -1px;
}
/* The browser's own ring is near-black, and hardly shows around Continue's dark fill. Enter in the last question's box sends the focus there. */
:root[data-steps] .elicit-skip:focus-visible,
:root[data-steps] .elicit-submit:focus-visible {
  outline: 2px solid var(--fill-accent);
  outline-offset: 2px;
}
/* A row: the square, a picture if the option has one, its words, the tick. !important over the inline card and tile styles that the read_me guide teaches. */
:root[data-steps] .elicit-pill {
  position: relative;
  display: flex !important;
  flex-direction: row !important;
  place-self: auto;
  align-items: center !important;
  gap: 10px !important;
  width: 100% !important;
  min-width: 0 !important;
  min-height: 44px;
  padding: 6px 10px !important;
  box-shadow: none !important;
  overflow: visible;
  border: 0;
  border-radius: 12px;
  background: var(--elicit-rule);
  color: var(--text-secondary);
  text-align: start;
  counter-increment: elicit-row;
}
:root[data-steps] .elicit-pill > :is(i, svg, img, :empty) {
  flex: none;
  order: -1;
  max-height: 40px;
}
/* An empty element with no class is a swatch that its own style draws: in a row it would have no width. */
:root[data-steps] .elicit-pill > :empty:not([class]) {
  width: 60px;
  margin: 0 !important;
}
:root[data-steps] .elicit-pill[aria-pressed="true"] {
  background: var(--elicit-rule);
  color: var(--text-primary);
}
:root[data-steps] .elicit-pill:first-child,
:root[data-steps] .elicit-pill[hidden]:first-child + .elicit-pill,
:root[data-steps][data-no-design-system]
  form.elicit:is(
    [data-source="drifting-trinket-slides"],
    [data-source="drifting-trinket-design"]
  )
  .elicit-pill:is(
    [data-design-system],
    [data-value="Use my design system"]
  ):first-child
  + .elicit-pill,
:root[data-steps] .elicit-pill:focus-visible + .elicit-pill {
  --elicit-rule: none;
}
:root[data-steps] .elicit-pill:focus-visible {
  background: var(--alpha-1);
  color: var(--text-primary);
}
@media (hover: hover) {
  :root[data-steps] .elicit-pill:hover {
    background: var(--alpha-1);
    color: var(--text-primary);
  }
  :root[data-steps] .elicit-pill:hover + .elicit-pill {
    --elicit-rule: none;
  }
  :root[data-steps]
    .elicit-pager
    > button:enabled:not([aria-disabled="true"]):hover {
    background: var(--fill-ghost-hover);
  }
  :root[data-steps]
    .elicit-pager
    > button:hover:not([data-hushed])
    > .elicit-tip {
    display: block;
  }
}
/* The square at a row's start: its digit key, or a checkbox where several can be picked. The second content keeps the digit out of the option's spoken name. */
:root[data-steps] .elicit-pill::before {
  content: counter(elicit-row);
  content: counter(elicit-row) / "";
  flex: none;
  order: -2;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--alpha-1);
  color: var(--text-secondary);
}
:root[data-steps] .elicit-pill[aria-pressed="true"]::before {
  background: var(--fill-accent);
  color: var(--on-accent);
}
:root[data-steps] [data-multi="true"] > .elicit-pill::before {
  content: "";
  box-sizing: border-box;
  width: 16px;
  height: 16px;
  margin: 6px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: var(--fill-field);
}
:root[data-steps] [data-multi="true"] > [aria-pressed="true"]::before {
  border-color: var(--fill-accent);
  background: var(--fill-accent);
}
/* The tick of a picked option, at the row's end or in its checkbox. The square alone would not do: it is not drawn for touch and loses its fill in forced colors. */
:root[data-steps] .elicit-pill[aria-pressed="true"]::after {
  content: "";
  flex: none;
  width: 9px;
  height: 5px;
  margin-inline: auto 8px;
  border: solid var(--text-accent);
  border-width: 0 0 1.5px 1.5px;
  transform: translate(0, -1.5px) rotate(-45deg);
}
:root[data-steps] [data-multi="true"] > [aria-pressed="true"]::after {
  position: absolute;
  inset-inline-start: 20px;
  width: 8px;
  height: 4px;
  margin: 0;
  border-color: var(--on-accent);
}
@media (pointer: coarse), (hover: none) {
  :root[data-steps] [data-multi="false"] > .elicit-pill::before {
    display: none;
  }
  /* A finger's worth around each small button, without moving what is drawn. */
  :root[data-steps] .elicit-pager > button::after {
    content: "";
    position: absolute;
    inset: -10px -4px;
  }
  :root[data-steps] .elicit-pager {
    gap: 10px;
  }
  :root[data-steps] .elicit-pager ~ .elicit-body .elicit-question {
    padding-inline-end: 172px;
  }
  :root[data-steps] [data-multi="false"] ~ .elicit-other {
    margin-inline-start: 10px;
  }
}
/* In a narrow frame the pager has a row of its own, or it would leave the question a few words' width. After the touch rules, whose reserve it undoes. */
@media (max-width: 420px) {
  :root[data-steps] .elicit-pager {
    position: static;
    justify-content: flex-end;
    padding: 10px 12px 0;
  }
  :root[data-steps] .elicit-pager ~ .elicit-body .elicit-question {
    padding-inline-end: 10px;
  }
  :root[data-steps] .elicit-pager ~ .elicit-body > .elicit-group {
    padding-top: 4px;
  }
}
@media (forced-colors: active) {
  :root[data-steps] .elicit-pill[aria-pressed="true"],
  :root[data-steps] .elicit-pill[aria-pressed="true"]::before {
    forced-color-adjust: auto;
  }
  :root[data-steps] .elicit-pill[aria-pressed="true"]::after {
    border-color: currentColor;
  }
}
/* The small page of a look card, at a row's size. */
:root[data-steps] .elicit-card > i {
  height: 40px;
  border: 0.5px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 8.5px 27.5px,
      var(--elicit-dot) 2.2px,
      transparent 2.7px
    ),
    radial-gradient(
      circle at 15.5px 27.5px,
      var(--elicit-dot) 2.2px,
      transparent 2.7px
    ),
    linear-gradient(var(--elicit-dot) 0 0) 8.5px 25px / 7px 5px no-repeat,
    linear-gradient(color-mix(in srgb, var(--elicit-ink) 45%, transparent) 0 0)
      6px 17px / 16px 1.5px no-repeat;
  background-color: var(--g, var(--surface-1));
}
:root[data-steps] .elicit-card > i::before {
  top: 9px;
  left: 6px;
  width: 22px;
  height: 3.5px;
  border-radius: 2px;
}
:root[data-steps] .elicit-card > i::after {
  top: 7.5px;
  right: 5.5px;
  width: 21px;
  height: 24px;
  border-radius: 3px;
  background-image: radial-gradient(
    circle,
    var(--elicit-dot) 4.6px,
    transparent 5.1px
  );
}
:root[data-steps] .elicit-other {
  width: auto;
  margin-block: 0 4px;
  margin-inline: 48px 10px;
}
:root[data-steps]
  .elicit-group
  > :not(.elicit-question, .elicit-pills, .elicit-other) {
  box-sizing: border-box;
  width: calc(100% - 20px);
  margin-inline: 10px;
}
/* A line the form carries outside its questions stays under them on every step. */
:root[data-steps] .elicit-body > :not(.elicit-group, .elicit-summary) {
  margin: 0 !important;
  padding: 0 16px 10px;
}

/* "Other" conditional text input.
 * background/color explicit — generic input rule no longer provides
 * these post-specificity-fix, UA Canvas/CanvasText mismatch in dark mode. */
form.elicit .elicit-other {
  /* elicitation.ts makes it a textarea: one line at rest, growing with the answer to six lines, then scrolling. */
  min-height: calc(var(--font-text-sm-size, 14px) * 32 / 14);
  /* For a browser without the lh unit, which drops the next line: six lines at the form's line height. */
  max-height: calc(var(--font-text-sm-size, 14px) * 120 / 14 + 12px);
  max-height: calc(6lh + 12px);
  padding: 5px 12px;
  field-sizing: content;
  resize: none;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--fill-field);
  color: var(--text-primary);
  width: 100%;
  box-sizing: border-box;
}
form.elicit .elicit-other[hidden] {
  display: none;
}

/* Textarea.
 * background/color explicit — generic textarea rule no longer provides
 * these post-specificity-fix, UA Canvas/CanvasText mismatch in dark mode. */
form.elicit .elicit-textarea {
  min-height: 84px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--fill-field);
  color: var(--text-primary);
  resize: vertical;
  box-sizing: border-box;
  width: 100%;
}
form.elicit .elicit-textarea::placeholder {
  color: var(--text-muted);
}

form.elicit .elicit-date {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--fill-field);
  color: var(--text-primary);
  width: fit-content;
  cursor: pointer;
}
/* Shared focus ring for all text inputs — info-blue border + soft glow */
form.elicit .elicit-other:focus,
form.elicit .elicit-textarea:focus,
form.elicit .elicit-date:focus {
  outline: none;
  border-color: var(--border-accent);
  box-shadow: 0 0 0 3px var(--bg-accent);
}

/* File upload — dashed dropzone + filled tiles.
 * Tile styling mirrors packages/chat/components/FileThumbnail.tsx (the
 * thumbnail users already see in the chat input row) so a file picked here
 * reads as the same object it becomes once attached. Dropzone is the first
 * flex child; tiles append after it (flow right). */
form.elicit .elicit-files {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 12px;
}
/* The phone apps cannot receive picked files (hostTakesFiles in elicitation.ts), so the box is hidden there and the
   textarea the form guidance pairs with it stays. !important beats a display the visual sets inline. */
:root[data-host-platform="mobile"] form.elicit .elicit-files {
  display: none !important;
}
form.elicit .elicit-dropzone {
  /* 120×120 = FileThumbnail SIZE_MAP.normal. Dashed stays 1px — 0.5px
   * dashed rasterizes to invisible gaps on non-retina. */
  width: 120px;
  height: 120px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  box-shadow: var(--elicit-shadow-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  /* Figma 5340:4071 — 2% text-000 wash over bg-000 */
  background: color-mix(in srgb, var(--text-primary) 2%, var(--surface-2));
  color: var(--text-muted);
  transition:
    border-color 120ms ease,
    background-color 120ms ease;
}
form.elicit .elicit-dropzone:hover {
  border-color: var(--text-accent);
  background: color-mix(in srgb, var(--text-accent) 4%, transparent);
}
form.elicit .elicit-dropzone svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}
form.elicit .elicit-dropzone input[type="file"] {
  display: none;
}

form.elicit .elicit-file-tile {
  /* FileThumbnail ThumbnailInteractionContainer:
   * rounded-lg border-0.5 border-border-300/25 shadow-sm shadow-always-black/5
   * bg-bg-000 px-2.5 py-2 gap-2.5 → 8px radius, 0.5px border, 8/10px pad */
  width: 120px;
  height: 120px;
  border: 0.5px solid var(--elicit-border-faint);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface-2);
  box-shadow: var(--elicit-shadow-sm);
  box-sizing: border-box;
  position: relative;
}
form.elicit .elicit-file-tile .name {
  /* FileThumbnail title: text-[12px] text-text-100 break-words line-clamp-3 */
  font-size: var(--font-text-xs-size, 12px);
  color: var(--text-primary);
  word-break: break-word;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
form.elicit .elicit-file-tile .badge {
  /* FileThumbnail ThumbnailTagContainer:
   * h-[18px] px-1 border-0.5 border-border-300/25 shadow-sm rounded
   * bg-bg-000/70 font-medium + inner text-[9px] uppercase font-bold */
  align-self: flex-start;
  height: calc(var(--font-text-xs-size, 12px) * 1.5);
  padding: 0 4px;
  display: inline-flex;
  align-items: center;
  border: 0.5px solid var(--elicit-border-faint);
  border-radius: 4px;
  background: color-mix(in srgb, var(--surface-2) 70%, transparent);
  box-shadow: var(--elicit-shadow-sm);
  font-size: calc(var(--font-text-xs-size, 12px) * 0.75);
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
}
/* FileThumbnail RemoveButton: w-5 h-5 -top-2 -left-2 rounded-full
 * border-0.5 border-border-300/25 bg-bg-000/90 backdrop-blur-sm.
 * Always visible (no group-hover in iframe — touch + no Tailwind group). */
form.elicit .elicit-file-tile .remove {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 20px;
  height: 20px;
  padding: 0;
  border: 0.5px solid var(--elicit-border-faint);
  border-radius: 9999px;
  background: color-mix(in srgb, var(--surface-2) 90%, transparent);
  backdrop-filter: blur(4px);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition:
    color 120ms ease,
    background-color 120ms ease;
}
form.elicit .elicit-file-tile .remove:hover {
  color: var(--text-secondary);
  background: color-mix(in srgb, var(--surface-2) 50%, transparent);
}

/* Footer as in AskUserInputSheet: a small ghost Skip button at the start and a small primary submit button at the end
 * (the sheet's is a brand-colored arrow button). */
form.elicit .elicit-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  /* A definite height (like .elicit-header) so the submitted-state height:0 transition can
   * interpolate (auto→0 snaps). */
  height: calc(var(--font-text-sm-size, 14px) * 48 / 14);
  padding-inline: 12px 16px;
  border-top: 0.5px solid var(--border);
}
form.elicit .elicit-skip,
form.elicit .elicit-submit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: calc(var(--font-text-sm-size, 14px) * 28 / 14);
  padding: 0 9px;
  /* Transparent, not none: forced-colors mode paints it, so the button keeps an edge there.
   * 9px padding + this 1px border = the small Button's 10px from edge to text. */
  border: 1px solid transparent;
  border-radius: 7px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color 100ms ease-out,
    transform 150ms cubic-bezier(0.165, 0.85, 0.45, 1);
}
form.elicit .elicit-skip:active,
form.elicit .elicit-submit:active {
  transform: scale(0.96);
}
@media (pointer: coarse), (hover: none) {
  form.elicit .elicit-other {
    min-height: calc(var(--font-text-sm-size, 14px) * 40 / 14);
    max-height: calc(var(--font-text-sm-size, 14px) * 120 / 14 + 20px);
    max-height: calc(6lh + 20px);
    padding-block: 9px;
  }
  form.elicit .elicit-date {
    height: calc(var(--font-text-sm-size, 14px) * 40 / 14);
  }
  form.elicit .elicit-skip,
  form.elicit .elicit-submit {
    height: calc(var(--font-text-sm-size, 14px) * 36 / 14);
    padding: 0 13px;
    border-radius: 8px;
  }
}
/* ghost */
form.elicit .elicit-skip {
  background: transparent;
  color: var(--text-primary);
}
form.elicit .elicit-skip:hover,
form.elicit .elicit-skip:active {
  background: var(--fill-ghost-hover);
}
/* primary. The auto margin sets it at the end, with or without a Skip before it. */
form.elicit .elicit-submit {
  margin-inline-start: auto;
  background: var(--fill-primary);
  color: var(--on-primary);
  font-weight: 500;
}
form.elicit .elicit-submit:hover {
  background: var(--fill-primary-hover);
  transform: scaleX(1.005) scaleY(1.015);
}
/* :hover and :active are both true during a mouse click; equal specificity →
 * source order wins, so without this the hover-grow above masks the press-down. */
form.elicit .elicit-submit:hover:active {
  transform: scale(0.96);
}

/* Pressed, and waiting for the host's answer. No pointer events, so that neither hover nor press restyles it. */
form.elicit .elicit-skip[aria-disabled="true"],
form.elicit .elicit-submit[aria-disabled="true"] {
  opacity: 0.7;
  pointer-events: none;
}

/* "Don't ask again": elicitation.ts adds it to the footer where the host offers it. */
form.elicit .elicit-optout {
  flex-shrink: 0;
  height: calc(var(--font-text-sm-size, 14px) * 28 / 14);
  padding: 0 9px;
  /* Transparent, not none: forced-colors mode paints it, so the button keeps an edge there. */
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--text-secondary);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color 100ms ease-out,
    color 100ms ease-out;
}
@media (hover: hover) {
  form.elicit .elicit-optout:hover {
    background: var(--fill-ghost-hover);
    color: var(--text-primary);
  }
}
/* Pressed, and waiting for the host's answer. */
form.elicit .elicit-optout[aria-disabled="true"] {
  background: transparent;
  color: var(--text-secondary);
  opacity: 0.7;
  cursor: default;
}
/* No room for three in a row (elicitation.ts measures): "Don't ask again" gets a row below, Skip stays at the start and Continue at the
 * end. The top padding keeps Skip and Continue where the fixed-height row centered them. Browsers without interpolate-size skip the closing animation. */
form.elicit .elicit-footer.elicit-footer-stacked {
  display: grid;
  grid-template-columns: auto 1fr auto;
  row-gap: 2px;
  height: auto;
  padding-block: calc(var(--font-text-sm-size, 14px) * 10 / 14) 8px;
  interpolate-size: allow-keywords;
}
/* The row appears at once: the footer's padding transition would start Skip and Continue too high. The fold still animates. */
form.elicit:not(.elicit-submitted) .elicit-footer.elicit-footer-stacked {
  transition: none;
}
form.elicit .elicit-footer-stacked > .elicit-skip {
  grid-area: 1 / 1;
}
form.elicit .elicit-footer-stacked > .elicit-submit {
  grid-area: 1 / 3;
}
/* As wide as its words only, so that the empty rest of the row is not a button. Words too long for the row wrap. */
form.elicit .elicit-footer-stacked > .elicit-optout {
  grid-area: 2 / 1 / auto / -1;
  justify-self: start;
  height: auto;
  min-height: calc(var(--font-text-sm-size, 14px) * 28 / 14);
  line-height: 1.2;
  text-align: start;
  white-space: normal;
}
@media (pointer: coarse), (hover: none) {
  form.elicit .elicit-optout {
    height: calc(var(--font-text-sm-size, 14px) * 36 / 14);
    padding: 0 13px;
    border-radius: 8px;
  }
  form.elicit .elicit-footer.elicit-footer-stacked {
    padding-block-start: calc(var(--font-text-sm-size, 14px) * 6 / 14);
  }
  form.elicit .elicit-footer-stacked > .elicit-optout {
    height: auto;
    min-height: calc(var(--font-text-sm-size, 14px) * 36 / 14);
  }
}

/* Post-submit: settleElicitation() adds .elicit-transitioning (the body fades out), then after 150ms swaps the body for the Q/A summary and adds
 * .elicit-submitted (the chrome shrinks to claude.ai's answered card, AskUserQuestionToolUseCell.tsx, while the body fades back in). */
form.elicit .elicit-body {
  transition: opacity 150ms ease-out;
}
form.elicit.elicit-transitioning .elicit-body {
  opacity: 0;
}
form.elicit.elicit-submitted {
  background: transparent;
  border-radius: 12px;
  box-shadow: none;
  padding: 16px;
  margin: 4px 1px 4px 0;
}
/* `display: none` can't transition — collapse to zero so the chrome animates
 * away with the form's 200ms transition instead of snapping. */
form.elicit .elicit-header,
form.elicit .elicit-footer {
  transition:
    opacity 200ms ease-out,
    height 200ms ease-out,
    padding 200ms ease-out,
    border-width 200ms ease-out,
    /* step to hidden after the collapse so Skip/Submit leave the tab order +
     * a11y tree (pointer-events:none alone doesn't). */
    visibility 0s linear 200ms;
}
form.elicit.elicit-submitted .elicit-header,
form.elicit.elicit-submitted .elicit-footer {
  opacity: 0;
  height: 0;
  padding-top: 0;
  padding-bottom: 0;
  border-width: 0;
  overflow: hidden;
  pointer-events: none;
  visibility: hidden;
}
form.elicit.elicit-submitted .elicit-body {
  padding: 0;
}
/* Quota-fallback "1" sentinel restore: shape check skips renderSubmittedSummary
 * so the body still has live inputs — dim them so the locked state reads. */
form.elicit.elicit-submitted .elicit-body:not(:has(.elicit-summary)) {
  pointer-events: none;
  opacity: 0.5;
}
/* sessionStorage restore path adds this alongside .elicit-submitted so
 * scroll-back/reload shows the summary immediately (no replayed crossfade). */
form.elicit.elicit-restored,
form.elicit.elicit-restored .elicit-body,
form.elicit.elicit-restored .elicit-header,
form.elicit.elicit-restored .elicit-footer {
  transition: none;
}
form.elicit .elicit-summary {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
form.elicit .elicit-summary-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
/* As SubmittedResponses.tsx: both lines are font-base, which claude.ai binds to the design system's body text (14px, regular). */
form.elicit .elicit-summary-q {
  color: var(--text-secondary);
}
form.elicit .elicit-summary-a {
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Headings — bare tags get correct color in both modes */
h1,
h2,
h3,
h4,
h5,
h6 {
  color: var(--text-primary);
}

.leader {
  stroke: var(--t);
  stroke-width: 0.5;
  stroke-dasharray: 4 3;
  fill: none;
}

/* Color ramp classes go on a rect, ellipse, circle, polygon or path, or on the <g> directly around it.
   CSS beats a fill attribute, so a path with one on or above it is skipped. light-dark() responds to ancestor color-scheme, not just OS preference. */
g.c-purple > rect,
g.c-purple > ellipse,
g.c-purple > circle,
g.c-purple > polygon,
rect.c-purple,
ellipse.c-purple,
circle.c-purple,
polygon.c-purple {
  fill: var(--shell-when-light, #eeedfe) var(--shell-when-dark, #3c3489);
  fill: light-dark(#eeedfe, #3c3489);
  stroke: var(--shell-when-light, #534ab7) var(--shell-when-dark, #afa9ec);
  stroke: light-dark(#534ab7, #afa9ec);
}
:where(g.c-purple) > :where(path:not([fill], [fill] *)),
:where(path.c-purple:not([fill], [fill] *)) {
  fill: var(--shell-when-light, #eeedfe) var(--shell-when-dark, #3c3489);
  fill: light-dark(#eeedfe, #3c3489);
  stroke: var(--shell-when-light, #534ab7) var(--shell-when-dark, #afa9ec);
  stroke: light-dark(#534ab7, #afa9ec);
}
.c-purple > .th,
.c-purple > .t {
  fill: var(--shell-when-light, #3c3489) var(--shell-when-dark, #cecbf6);
  fill: light-dark(#3c3489, #cecbf6);
}
.c-purple > .ts {
  fill: var(--shell-when-light, #534ab7) var(--shell-when-dark, #afa9ec);
  fill: light-dark(#534ab7, #afa9ec);
}
g.c-teal > rect,
g.c-teal > ellipse,
g.c-teal > circle,
g.c-teal > polygon,
rect.c-teal,
ellipse.c-teal,
circle.c-teal,
polygon.c-teal {
  fill: var(--shell-when-light, #e1f5ee) var(--shell-when-dark, #085041);
  fill: light-dark(#e1f5ee, #085041);
  stroke: var(--shell-when-light, #0f6e56) var(--shell-when-dark, #5dcaa5);
  stroke: light-dark(#0f6e56, #5dcaa5);
}
:where(g.c-teal) > :where(path:not([fill], [fill] *)),
:where(path.c-teal:not([fill], [fill] *)) {
  fill: var(--shell-when-light, #e1f5ee) var(--shell-when-dark, #085041);
  fill: light-dark(#e1f5ee, #085041);
  stroke: var(--shell-when-light, #0f6e56) var(--shell-when-dark, #5dcaa5);
  stroke: light-dark(#0f6e56, #5dcaa5);
}
.c-teal > .th,
.c-teal > .t {
  fill: var(--shell-when-light, #085041) var(--shell-when-dark, #9fe1cb);
  fill: light-dark(#085041, #9fe1cb);
}
.c-teal > .ts {
  fill: var(--shell-when-light, #0f6e56) var(--shell-when-dark, #5dcaa5);
  fill: light-dark(#0f6e56, #5dcaa5);
}
g.c-coral > rect,
g.c-coral > ellipse,
g.c-coral > circle,
g.c-coral > polygon,
rect.c-coral,
ellipse.c-coral,
circle.c-coral,
polygon.c-coral {
  fill: var(--shell-when-light, #faece7) var(--shell-when-dark, #712b13);
  fill: light-dark(#faece7, #712b13);
  stroke: var(--shell-when-light, #993c1d) var(--shell-when-dark, #f0997b);
  stroke: light-dark(#993c1d, #f0997b);
}
:where(g.c-coral) > :where(path:not([fill], [fill] *)),
:where(path.c-coral:not([fill], [fill] *)) {
  fill: var(--shell-when-light, #faece7) var(--shell-when-dark, #712b13);

/* Mermaid class/ER diagrams — match house aesthetic.
   Mermaid v11 class/ER renderers use <path> (not <rect>) with inline stroke/fill
   attrs that IGNORE themeVariables mainBkg/nodeBorder. Labels are
   <foreignObject><div><span class="nodeLabel"><p>text</p> — NOT <text>. All style
   fixes require !important to beat inline attrs + mermaid's inline <style>.
   Selectors target .classDiagram/.erDiagram SVG root classes (always present)
   rather than a .mermaid wrapper (which the model sometimes omits). */
svg.classDiagram,
svg.erDiagram {
  font-size: 13px;
  max-width: 100%;
  height: auto;
}
/* Mermaid sizes foreignObject to fit measured text width. If we upsize post-render,
   text clips. So: overflow visible on FO, and widen inner div past its max-width. */
svg.classDiagram foreignObject,
svg.erDiagram foreignObject {
  overflow: visible;
}
svg.classDiagram foreignObject > div,
svg.erDiagram foreignObject > div {
  max-width: none !important;
}
/* Body text: members, methods, attribute rows. Mermaid sizes its boxes with the family in skill.ts, so labels use that family and not --font-sans. */
svg.classDiagram .nodeLabel,
svg.erDiagram .nodeLabel,
svg.classDiagram .label foreignObject div,
svg.erDiagram .label foreignObject div {
  font-family: "anthropic-sans", sans-serif !important;
  font-size: 13px !important;
  font-weight: 400 !important;
  color: var(--text-secondary) !important;
}
/* Titles: classDiagram wraps in .label-group; erDiagram wraps in .name */
svg.classDiagram .label-group .nodeLabel,
svg.erDiagram .name .nodeLabel {
  font-size: 14px !important;
  font-weight: 500 !important;
  color: var(--text-primary) !important;
}
/* Kill mermaid's inline style="font-weight: bolder" on the .label wrapper */
svg.classDiagram .label-group .label {
  font-weight: 500 !important;
}
/* Edge labels (relationship verbs + cardinality) */
svg.classDiagram .edgeLabel,
svg.classDiagram .edgeLabel span,
svg.classDiagram .edgeTerminals foreignObject div,
svg.erDiagram .edgeLabel,
svg.erDiagram .edgeLabel span {
  font-size: 11px !important;
  color: var(--text-muted) !important;
}
/* Box outlines, row stripes, dividers — all rendered as <path> with inline attrs.
   Mermaid's '#id .node path { fill:... }' CSS beats fill="none" attr — force fill:none. */
svg.classDiagram .node path[stroke]:not([stroke="none"]),
svg.classDiagram .divider path,
svg.erDiagram .node path[stroke]:not([stroke="none"]),
svg.erDiagram .divider path {
  stroke: var(--border) !important;
  stroke-width: 0.5px !important;
  fill: none !important;
}
/* classDiagram: box fill (inside .basic.label-container). Mermaid's inline CSS
   '#id .node path { stroke:... }' beats the stroke="none" attr (SVG attrs have
   lowest specificity), and the fill path is open (no Z) so the phantom stroke
   only paints top/right/bottom — left edge looks darker. Kill the stroke. */
svg.classDiagram .node .basic path[fill]:not([fill="none"]) {
  fill: var(--surface-2) !important;
  stroke: none !important;
  stroke-width: 0 !important;
}
/* erDiagram: header row (anonymous first-child <g>) uses secondary bg */
svg.erDiagram .node > g:first-child > path[fill]:not([fill="none"]) {
  fill: var(--surface-1) !important;
}
/* erDiagram: row stripes */
svg.erDiagram .row-rect-odd path[fill]:not([fill="none"]) {
  fill: var(--surface-2) !important;
}
svg.erDiagram .row-rect-even path[fill]:not([fill="none"]) {
  fill: var(--surface-1) !important;
}
/* Connector lines */
svg.erDiagram .relationshipLine,
svg.classDiagram .relation {
  stroke: var(--text-muted) !important;
  stroke-width: 1px !important;
}
svg.classDiagram .marker,
svg.classDiagram marker path,
svg.erDiagram .marker,
svg.erDiagram marker path {
  stroke: var(--text-muted) !important;
  stroke-width: 1px !important;
}
svg.classDiagram marker path[fill]:not([fill="none"]):not([fill="transparent"]),
svg.erDiagram marker path[fill]:not([fill="none"]):not([fill="transparent"]) {
  fill: var(--text-muted) !important;
}
/* Relationship label background — kill default 0.7 opacity */
svg.classDiagram .labelBkg,
svg.erDiagram .labelBkg {
  background-color: var(--surface-2) !important;
  opacity: 1 !important;

body {
  position: relative;
}
#vis-container {
  width: 100%;
  position: relative;
  overflow: hidden;
  /* Theme-aware default so text the model writes without an explicit
   * `color:` reads correctly when `data-mode` (app theme) diverges from
   * the browser's prefers-color-scheme — otherwise uncolored labels
   * inherit the UA default (black) over a dark surface. */
  color: var(--text-primary);
}
/* Registered so the values set on #vis-container stay on it, not inherited by every element of the visual. */
@property --wide-fade-left {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
@property --wide-fade-right {
  syntax: "<length>";
  inherits: false;
  initial-value: 0px;
}
/* A visual laid out wider than the frame scrolls sideways (wide-scroll.ts). Each side with hidden content fades, except
   in a copy's picture, in View larger, and under keyboard focus, so the ring drawn inside shows. */
:root:not([data-open-larger]) #vis-container.scrolls-wide:not(.whole-width) {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  /* wide-scroll.ts's FADE_PX, so focusing an element inside scrolls it clear of the fade */
  scroll-padding-inline: 32px;
  /* No scrollbar row, as on html and body (base.css): a row would add to the height the frame is sized to. */
  scrollbar-width: none;
}
#vis-container.scrolls-wide::-webkit-scrollbar {
  height: 0;
}
:root:not([data-open-larger]) #vis-container.scrolls-wide:focus-visible {
  outline-offset: -2px;
}
:root:not([data-open-larger]):not([data-picture])
  #vis-container.scrolls-wide:not(.whole-width):not(
    :focus-visible
  )[data-wide-more] {
  -webkit-mask-image: linear-gradient(
    to right,
    transparent,
    #000 var(--wide-fade-left),
    #000 calc(100% - var(--wide-fade-right)),
    transparent
  );
  mask-image: linear-gradient(
    to right,
    transparent,
    #000 var(--wide-fade-left),
    #000 calc(100% - var(--wide-fade-right)),
    transparent
  );
}
/* While a copy is made of a drawing wider than the frame (clipboard-copy.ts): the clip above and below stays. A block
   container also takes flow-root, which keeps margins and floats inside as the clip did, so nothing on the page moves. */
#vis-container.whole-width {
  overflow-x: visible;
  overflow-y: clip;
}
#vis-container.whole-width-block {
  display: flow-root;
}
/* A visual can make <body> a grid or flex box, which grows the container to fit the drawing unless overflow is hidden,
   and clip is not. Zero minimums do what hidden did. :where() lets a minimum the visual sets outside @layer win. */
:where(#vis-container.whole-width) {
  min-width: 0;
  min-height: 0;
}
#vis-container > svg {
  display: block;
  margin-inline: auto;
  max-width: 100%;
  height: auto;
  overflow: visible;
}
/* host-init.ts sets data-center-content when the host asks. Only a lone top-level div moves, so
   stacked bars or bubbles keep their edges; :where() lets a side margin the visual sets win. */
:where(:root[data-center-content] #vis-container) > div:where(:only-of-type) {
  margin-inline: auto;
}
/* In a copied picture even a drawn ui-card is undefined, but :root is then an svg without data-show-card-fallback.
   :where() lets a visual hide a card. */
:where(
  :root[data-show-card-fallback]:not([data-draw-cards])
    ui-card[fallback]:not([fallback=""], [hidden], :defined)
) {
  display: block;
}
:root[data-show-card-fallback]:not([data-draw-cards])
  ui-card[fallback]:not([fallback=""], [hidden], :defined)
  > * {
  display: none;
}
:root[data-show-card-fallback]:not([data-draw-cards])
  ui-card[fallback]:not([fallback=""], [hidden], :defined)::before {
  content: attr(fallback);
}

/* Action buttons group.
   hidden attr is removed on tool-input (final) so buttons never show during streaming. */
#action-btns {
  /* Fixed, so that the button and its closed menu, which is hidden but still laid out below it, add nothing to the page's
     scroll height. With absolute, the mouse wheel scrolls a short visual out of sight inside its iframe. */
  position: fixed;
  /* Centred in an iframe too short for 8px above and below the 28px trigger. */
  top: min(8px, (100vh - 28px) / 2);
  right: 8px;
  z-index: 2147483647;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
/* display:flex above would override UA [hidden] — restore it */
#action-btns[hidden] {
  display: none;
}
body:hover #action-btns,
#action-btns[data-hold-open],
#action-btns[data-keys-focus] {
  opacity: 1;
}
/* Keyboard focus in the group shows it; a mouse click on ⋯ alone does not count. Kept apart from the rule above, which a
   browser without :has() would otherwise drop whole. */
#action-btns:has(:focus-visible) {
  opacity: 1;
}
/* The design system's focus ring. Forced colours remove the box-shadow but show this outline. */

  outline-offset: 2px;
  box-shadow: var(--focus-shadow);

   would never appear, or would stick visible after a stray tap. */

    display: none;

   screen readers. Not while Copy as image holds the menu open (data-hold-open) or the button or its menu has focus. */

  opacity: 0;
  pointer-events: none;

/* Top padding that keeps the button off the visual's text and controls (menu-room.ts); the button is fixed, so the visual moves and
   the button stays. After any transition, !important beats the visual's own top padding, which --menu-room includes. Selector copied in mcp-app-helper.ts. */

  padding-top: var(--menu-room) !important;

:root[data-keep-menu-clear][data-menu-held]:not([data-open-larger]) body {

  min-height: 0 !important;
  overflow: hidden !important;

     this empty wrapper no room. */
  all: revert;

#vis-container ~ #larger-btns::after {

  position: relative !important;
  width: 36px;
  height: 36px;
